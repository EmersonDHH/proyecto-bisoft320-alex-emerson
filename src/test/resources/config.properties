# Configuracion de ejecucion. Cualquier valor se puede sobrescribir con -Dclave=valor
# Ejemplo: mvn test -Dbrowser=firefox -Dheadless=false

base.url=https://www.saucedemo.com
browser=chrome
headless=true
timeout.seconds=10
window.width=1366
window.height=900

# Umbral del requerimiento no funcional RNF01 (tiempo maximo de inicio de sesion)
login.max.millis=3000

# Opcional: rutas a binarios locales (dejar vacio para usar Selenium Manager)
chrome.binary=
chrome.driver=
# Solo para ambientes donde la version del driver local no coincide con la de Chrome
chrome.disable.build.check=false
